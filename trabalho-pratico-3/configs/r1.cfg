configure terminal
! ---------------------------------------------------------
! Template Dinâmico BGP - TP4 (Gerado para r1)
! ---------------------------------------------------------

! --- 0. Rotas Estáticas (Garante a origem no BGP) ---
ip route 203.0.1.0/24 Null0

! --- 1. Configuração de Interfaces ---
interface lo
 ip address 1.1.1.1/32
exit

interface r1-eth1
 description Link to s1 (LAN)
 ip address 203.0.1.1/24
exit
interface r1-eth2
 description Link to r2
 ip address 203.0.12.1/30
exit

! --- 2. Processo BGP Base ---
router bgp 65001
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy

 ! Anúncio das redes locais
  network 203.0.1.0/24
 
 ! Declaração de Vizinhos
  neighbor 203.0.12.2 remote-as 65001
 neighbor 203.0.12.2 description iBGP para r2
 
 ! Atividade 2: Autenticação MD5
 neighbor 203.0.12.2 password tp3senha
 
  
 ! --- 3. Ativação de Políticas (IPv4) ---
 address-family ipv4 unicast
    neighbor 203.0.12.2 activate
  neighbor 203.0.12.2 send-community both
  
    ! R1: Marcar prefixo
  network 203.0.1.0/24 route-map RM_MARK_COMM
  
   exit-address-family
exit

! --- 4. Route-Maps ---

ip prefix-list PL_LOCAL seq 5 permit 203.0.1.0/24

route-map RM_MARK_COMM permit 10
 match ip address prefix-list PL_LOCAL
 set community 65001:100
route-map RM_MARK_COMM permit 20


end
write