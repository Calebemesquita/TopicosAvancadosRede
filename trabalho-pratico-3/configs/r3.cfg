configure terminal
! ---------------------------------------------------------
! Template Dinâmico BGP - TP4 (Gerado para r3)
! ---------------------------------------------------------

! --- 0. Rotas Estáticas (Garante a origem no BGP) ---
ip route 203.100.2.0/24 Null0
ip route 203.101.0.0/24 Null0
ip route 192.168.100.0/24 Null0

! --- 1. Configuração de Interfaces ---
interface lo
 ip address 3.3.3.3/32
exit

interface r3-eth1
 description Link to r2
 ip address 203.0.23.2/30
exit

! --- 2. Processo BGP Base ---
router bgp 65010
 bgp router-id 3.3.3.3
 no bgp ebgp-requires-policy

 ! Anúncio das redes locais
  network 203.100.2.0/24
  network 203.101.0.0/24
  network 192.168.100.0/24
 
 ! Declaração de Vizinhos
  neighbor 203.0.23.1 remote-as 65001
 neighbor 203.0.23.1 description eBGP para r2
 
 ! Atividade 2: Autenticação MD5
 neighbor 203.0.23.1 password tp3senha
 
  ! Atividade 3: TTL Security (eBGP apenas)
 neighbor 203.0.23.1 ttl-security hops 1
  
 ! --- 3. Ativação de Políticas (IPv4) ---
 address-family ipv4 unicast
    neighbor 203.0.23.1 activate
  neighbor 203.0.23.1 send-community both
  
  
   exit-address-family
exit

! --- 4. Route-Maps ---



end
write