configure terminal
! ---------------------------------------------------------
! Template Dinâmico BGP - TP4 (Gerado para r4)
! ---------------------------------------------------------

! --- 0. Rotas Estáticas (Garante a origem no BGP) ---
ip route 203.100.2.0/24 Null0
ip route 203.102.0.0/24 Null0
ip route 172.16.0.0/16 Null0

! --- 1. Configuração de Interfaces ---
interface lo
 ip address 4.4.4.4/32
exit

interface r4-eth1
 description Link to r2
 ip address 203.0.24.2/30
exit

! --- 2. Processo BGP Base ---
router bgp 65020
 bgp router-id 4.4.4.4
 no bgp ebgp-requires-policy

 ! Anúncio das redes locais
  network 203.100.2.0/24
  network 203.102.0.0/24
  network 172.16.0.0/16
 
 ! Declaração de Vizinhos
  neighbor 203.0.24.1 remote-as 65001
 neighbor 203.0.24.1 description eBGP para r2
 
 ! Atividade 2: Autenticação MD5
 neighbor 203.0.24.1 password tp3senha
 
  ! Atividade 3: TTL Security (eBGP apenas)
 neighbor 203.0.24.1 ttl-security hops 1
  
 ! --- 3. Ativação de Políticas (IPv4) ---
 address-family ipv4 unicast
    neighbor 203.0.24.1 activate
  neighbor 203.0.24.1 send-community both
  
  
   exit-address-family
exit

! --- 4. Route-Maps ---



end
write